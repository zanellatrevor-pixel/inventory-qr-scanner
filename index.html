<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>

    :root {
      --navy: #031729;
      --navy2: #082c49;
      --red: #d71920;
      --green: #63d13f;
      --panel: #0c1f31;
      --panel2: #10283d;
      --muted: #8ea0af;
      --light: #eef1f4;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: #10243a;
    }


    /* =========================================
       HEADER
       ========================================= */

    .appHeader {
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      color: white;

      border-bottom:
        4px solid var(--red);

      padding:
        14px 18px;

      display: flex;
      align-items: center;
      gap: 14px;
    }


    .homeLogo {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform .12s ease,
        opacity .12s ease;
    }


    .homeLogo:active {
      transform: scale(.94);
      opacity: .8;
    }


    .logo {
      width: 74px;
      height: 74px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }


    .headerText {
      flex: 1;
      min-width: 0;
    }


    .headerTitle {
      margin: 0;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: .5px;
    }


    .headerSubtitle {
      margin-top: 4px;
      font-size: 14px;
      color: #c7d1d9;
    }


    .secure {
      font-size: 11px;
      color: #aebbc5;
      white-space: nowrap;
    }


    /* =========================================
       PAGE
       ========================================= */

    .page {
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }


    /* =========================================
       STATUS
       ========================================= */

    #message {
      margin-bottom: 16px;
      padding: 13px;
      border-radius: 9px;
      background: #e9f5e9;
      border: 1px solid #b6deb9;
      color: #16752a;
      text-align: center;
      font-weight: 800;
    }


    /* =========================================
       LOOKUP PANEL
       ========================================= */

    .scanPanel {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow:
        0 2px 8px rgba(0,0,0,.09);
      margin-bottom: 18px;
    }


    .sectionTitle {
      font-size: 12px;
      font-weight: 900;
      color: #566575;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: .6px;
    }


    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3da;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }


    input:focus,
    textarea:focus {
      outline: none;
      border-color: #0b4a78;
      box-shadow:
        0 0 0 2px rgba(11,74,120,.12);
    }


    .findButton {
      margin-top: 10px;
      width: 100%;
      border: none;
      border-radius: 7px;
      padding: 14px;
      background: #062b4d;
      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }


    /* =========================================
       ITEM CARD
       ========================================= */

    #itemCard {
      display: none;
    }


    .itemPanel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow:
        0 3px 12px rgba(0,0,0,.10);
    }


    #itemName {
      font-size: 29px;
      font-weight: 900;
      color: #092c4a;
      margin-bottom: 18px;
    }


    .itemGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }


    .dataLabel {
      font-size: 11px;
      color: #61707e;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 10px;
      letter-spacing: .4px;
    }


    .dataValue {
      font-size: 20px;
      font-weight: 900;
      color: #102c4a;
      margin-top: 2px;
    }


    /* =========================================
       ON HAND
       ========================================= */

    .onHandPanel {
      background:
        linear-gradient(
          135deg,
          #082c4d,
          #00315e
        );

      color: white;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }


    .onHandLabel {
      font-size: 14px;
      font-weight: 900;
    }


    #onHand {
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
      margin-top: 8px;
    }


    .stockGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 10px;
      background: #f7f8f9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #dfe3e6;
    }


    .stockBox {
      text-align: center;
      padding: 12px;
    }


    .stockBox + .stockBox {
      border-left:
        1px solid #dfe3e6;
    }


    .needed {
      color: #c51c1c;
    }


    .excess {
      color: #18803a;
    }


    .stockNumber {
      font-size: 25px;
      font-weight: 900;
    }


    /* =========================================
       TRANSACTIONS
       ========================================= */

    .transactionSection {
      margin-top: 18px;
    }


    .actionButtons {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 10px;
    }


    .actionButton {
      border: none;
      padding: 15px 8px;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }


    .issue {
      background:
        linear-gradient(
          #df2525,
          #c31515
        );
    }


    .restock {
      background:
        linear-gradient(
          #299443,
          #18752f
        );
    }


    .adjust {
      background:
        linear-gradient(
          #e79a12,
          #c97b00
        );
    }


    /* =========================================
       TRANSACTION FORM
       ========================================= */

    .transactionForm {
      margin-top: 14px;
      background: #f8f9fa;
      border: 1px solid #dfe3e6;
      border-radius: 9px;
      padding: 15px;
    }


    .formGrid {
      display: grid;
      grid-template-columns:
        120px 1fr;
      gap: 12px;
    }


    .formLabel {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
      color: #566575;
      margin-bottom: 5px;
    }


    /* =========================================
       SCAN NEXT
       ========================================= */

    .scanNextButton {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background:
        linear-gradient(
          135deg,
          #315a71,
          #3e697d
        );
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }


    /* =========================================
       FOOTER
       ========================================= */

    .footerNav {
      margin-top: 20px;
      background: #06233c;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      border-radius: 8px;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media(max-width:600px) {

      .logo {
        width: 62px;
        height: 62px;
      }

      .headerTitle {
        font-size: 22px;
      }

      .itemGrid {
        grid-template-columns:
          1fr;
      }

      .actionButtons {
        grid-template-columns:
          1fr;
      }

      .formGrid {
        grid-template-columns:
          1fr;
      }

      .secure {
        display: none;
      }

    }

  </style>

</head>


<body>


<!-- =========================================
     HEADER
     ========================================= -->

<div class="appHeader">

  <a
    href="https://zanellatrevor-pixel.github.io/inventory-qr-scanner/"
    target="_top"
    class="homeLogo"
    aria-label="Return to Inventory Scanner Home"
  >

    <img
      class="logo"
      src="https://zanellatrevor-pixel.github.io/inventory-qr-scanner/rainier-dustoff.png"
      alt="Rainier DUSTOFF"
    >

  </a>


  <div class="headerText">

    <div class="headerTitle">
      C1-168 INVENTORY
    </div>

    <div class="headerSubtitle">
      Det 2 • C Co • 1-168 GSAB
    </div>

  </div>


  <div class="secure">
    🔒 SECURE
  </div>

</div>



<div class="page">


  <!-- =========================================
       MESSAGE
       ========================================= -->

  <div id="message">
    Ready
  </div>



  <!-- =========================================
       SEARCH
       ========================================= -->

  <div class="scanPanel">

    <div class="sectionTitle">
      NIIN Lookup
    </div>


    <input
      type="text"
      id="niin"
      value="<?= scannedNIIN ?>"
      placeholder="Scan or enter NIIN"
      autocomplete="off"
      onkeydown="
        if(event.key === 'Enter') {
          lookupItem();
        }
      "
    >


    <button
      class="findButton"
      onclick="lookupItem()"
    >
      FIND ITEM
    </button>

  </div>



  <!-- =========================================
       ITEM
       ========================================= -->

  <div id="itemCard">

    <div class="itemPanel">


      <div id="itemName">
      </div>


      <div class="itemGrid">


        <!-- LEFT COLUMN -->

        <div>

          <div class="dataLabel">
            NIIN
          </div>

          <div
            class="dataValue"
            id="displayNIIN"
          >
          </div>


          <div class="dataLabel">
            LIN
          </div>

          <div
            class="dataValue"
            id="displayLIN"
          >
          </div>


          <div class="dataLabel">
            Location
          </div>

          <div
            class="dataValue"
            id="location"
          >
          </div>


          <div class="dataLabel">
            Target Quantity
          </div>

          <div
            class="dataValue"
            id="target"
          >
          </div>

        </div>



        <!-- RIGHT COLUMN -->

        <div>


          <div class="onHandPanel">

            <div class="onHandLabel">
              CURRENT ON HAND
            </div>

            <div id="onHand">
              —
            </div>

          </div>


          <div class="stockGrid">


            <div class="stockBox needed">

              <strong>
                NEEDED
              </strong>

              <div
                class="stockNumber"
                id="needed"
              >
                0
              </div>

            </div>


            <div class="stockBox excess">

              <strong>
                EXCESS
              </strong>

              <div
                class="stockNumber"
                id="excess"
              >
                0
              </div>

            </div>


          </div>

        </div>


      </div>



      <!-- =========================================
           TRANSACTIONS
           ========================================= -->

      <div class="transactionSection">


        <div class="actionButtons">


          <button
            class="actionButton issue"
            onclick="submitTransaction('ISSUE')"
          >
            − ISSUE
          </button>


          <button
            class="actionButton restock"
            onclick="submitTransaction('RESTOCK')"
          >
            + RESTOCK
          </button>


          <button
            class="actionButton adjust"
            onclick="submitTransaction('ADJUSTMENT')"
          >
            ADJUST COUNT
          </button>


        </div>



        <div class="transactionForm">


          <div class="formGrid">


            <div>

              <div class="formLabel">
                Quantity
              </div>

              <input
                type="number"
                id="qty"
                min="1"
                step="1"
                value="1"
              >

            </div>


            <div>

              <div class="formLabel">
                Initials / User
              </div>

              <input
                type="text"
                id="initials"
                placeholder="Example: TZ"
              >

            </div>


          </div>


          <div class="formLabel">
            Notes
          </div>


          <textarea
            id="notes"
            placeholder="Optional notes"
          ></textarea>


        </div>



        <!-- SCAN NEXT ITEM -->

        <button
          class="scanNextButton"
          onclick="goHome()"
        >
          SCAN NEXT ITEM
        </button>


      </div>


    </div>

  </div>



  <div class="footerNav">
    DET 2 • C1-168 MES INVENTORY SYSTEM
  </div>


</div>



<script>


const SCANNER_HOME_URL =
  "https://zanellatrevor-pixel.github.io/inventory-qr-scanner/";


let currentNIIN = "";



/* =========================================
   HOME
   ========================================= */

function goHome() {

  window.top.location.href =
    SCANNER_HOME_URL;

}



/* =========================================
   AUTOLOAD
   ========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const niin =
      document
        .getElementById("niin")
        .value
        .trim();

    if (niin) {

      lookupItem();

    } else {

      showMessage(
        "READY"
      );

    }

  }
);



/* =========================================
   LOOKUP
   ========================================= */

function lookupItem() {


  const niin =
    document
      .getElementById("niin")
      .value
      .trim();


  if (!niin) {

    showMessage(
      "Enter or scan a NIIN."
    );

    return;
  }


  showMessage(
    "Loading inventory..."
  );


  google.script.run

    .withSuccessHandler(
      function(item) {


        if (
          !item ||
          item.found !== true
        ) {


          document
            .getElementById("itemCard")
            .style.display =
            "none";


          showMessage(
            item &&
            item.message
              ? item.message
              : "Item not found."
          );


          return;

        }


        currentNIIN =
          String(item.niin).trim();


        setText(
          "niin",
          currentNIIN,
          true
        );


        setText(
          "itemName",
          item.commonItem
        );


        setText(
          "displayNIIN",
          item.niin
        );


        setText(
          "displayLIN",
          item.lin
        );


        setText(
          "target",
          item.targetQty
        );


        setText(
          "onHand",
          item.onHand
        );


        setText(
          "needed",
          item.needed
        );


        setText(
          "excess",
          item.excess
        );


        setText(
          "location",
          item.location ||
          "Not assigned"
        );


        document
          .getElementById("itemCard")
          .style.display =
          "block";


        showMessage(
          "✓ ITEM LOADED"
        );

      }
    )

    .withFailureHandler(
      function(error) {

        showMessage(
          "Lookup error: "
          +
          getErrorMessage(error)
        );

      }
    )

    .getItemByNIIN(
      niin
    );

}



/* =========================================
   TRANSACTION
   ========================================= */

function submitTransaction(
  action
) {


  if (!currentNIIN) {

    showMessage(
      "Scan or find an item first."
    );

    return;
  }


  const qty =
    Number(
      document
        .getElementById("qty")
        .value
    );


  const initials =
    document
      .getElementById("initials")
      .value
      .trim();


  const notes =
    document
      .getElementById("notes")
      .value
      .trim();


  if (
    !Number.isFinite(qty) ||
    qty <= 0
  ) {

    showMessage(
      "Enter a valid quantity."
    );

    return;
  }


  showMessage(
    "Processing "
    +
    action
    +
    "..."
  );


  google.script.run

    .withSuccessHandler(
      function(result) {


        if (
          !result ||
          result.success !== true
        ) {

          showMessage(
            "Transaction was not completed."
          );

          return;
        }


        setText(
          "onHand",
          result.onHand
        );


        setText(
          "needed",
          result.needed
        );


        setText(
          "excess",
          result.excess
        );


        document
          .getElementById("qty")
          .value =
          "1";


        document
          .getElementById("notes")
          .value =
          "";


        showMessage(
          "✓ "
          +
          result.commonItem
          +
          " UPDATED: "
          +
          result.previousQty
          +
          " → "
          +
          result.newQty
        );

      }
    )

    .withFailureHandler(
      function(error) {

        showMessage(
          "Transaction error: "
          +
          getErrorMessage(error)
        );

      }
    )

    .processTransaction(

      currentNIIN,

      action,

      qty,

      initials,

      notes

    );

}



/* =========================================
   HELPERS
   ========================================= */

function setText(
  id,
  value,
  input
) {


  const result =
    value === null ||
    value === undefined ||
    value === ""
      ? "—"
      : String(value);


  const element =
    document.getElementById(id);


  if (input) {

    element.value =
      result === "—"
        ? ""
        : result;

  }

  else {

    element.textContent =
      result;

  }

}



function getErrorMessage(
  error
) {

  if (
    error &&
    error.message
  ) {

    return String(
      error.message
    );

  }

  return String(
    error ||
    "Unknown error"
  );

}



function showMessage(
  text
) {

  document
    .getElementById("message")
    .textContent =
    String(text);

}


</script>


</body>

</html>
