<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>C1-168 Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    :root {
      --navy: #031729;
      --navy2: #082c49;
      --red: #d71920;
      --green: #63d13f;
      --muted: #9fb0bf;
      --panel: #0c1f31;
      --panel2: #10283d;
      --white: #ffffff;
      --light: #eef1f4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020d17;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      min-height: 100vh;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      border-bottom: 4px solid var(--red);

      padding:
        max(14px, env(safe-area-inset-top))
        18px
        14px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: contain;
      flex-shrink: 0;
    }

    .headerText {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 25px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .subtitle {
      margin-top: 5px;
      color: #c7d1d9;
      font-size: 14px;
    }

    .secure {
      font-size: 11px;
      color: #aebbc5;
      white-space: nowrap;
    }


    /* =========================
       MAIN PAGE
       ========================= */

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 16px 34px;
    }


    /* =========================
       INTRO
       ========================= */

    .scanIntro {
      text-align: center;
      margin: 4px 0 18px;
    }

    .scanIcon {
      font-size: 38px;
      color: var(--green);
      line-height: 1;
      margin-bottom: 5px;
    }

    .scanTitle {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .scanSubtitle {
      margin-top: 7px;
      color: #bcc7cf;
      font-size: 15px;
    }


    /* =========================
       CAMERA FRAME
       ========================= */

    .scannerShell {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #425466;

      box-shadow:
        0 8px 30px rgba(0,0,0,.35);
    }

    #reader {
      width: 100%;
      min-height: 330px;
      background: #000;
    }

    #reader video {
      object-fit: cover !important;
    }


    /* =========================
       SCAN CORNERS
       ========================= */

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      z-index: 20;
      pointer-events: none;
    }

    .corner.tl {
      left: 12px;
      top: 12px;
      border-left: 4px solid var(--green);
      border-top: 4px solid var(--green);
      border-radius: 8px 0 0 0;
    }

    .corner.tr {
      right: 12px;
      top: 12px;
      border-right: 4px solid var(--green);
      border-top: 4px solid var(--green);
      border-radius: 0 8px 0 0;
    }

    .corner.bl {
      left: 12px;
      bottom: 12px;
      border-left: 4px solid var(--green);
      border-bottom: 4px solid var(--green);
      border-radius: 0 0 0 8px;
    }

    .corner.br {
      right: 12px;
      bottom: 12px;
      border-right: 4px solid var(--green);
      border-bottom: 4px solid var(--green);
      border-radius: 0 0 8px 0;
    }


    /* =========================
       CONTROLS
       ========================= */

    .controlRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 9px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondaryButton {
      background: #142b3f;
      color: white;
      border: 1px solid #314a5f;
    }

    .restartButton {
      background:
        linear-gradient(
          135deg,
          #315a71,
          #3e697d
        );

      color: white;
    }


    /* =========================
       MANUAL NIIN
       ========================= */

    .manualPanel {
      margin-top: 16px;

      background:
        linear-gradient(
          135deg,
          #0c1f31,
          #10283d
        );

      border: 1px solid #314a5f;
      border-radius: 11px;
      padding: 15px;
    }

    .manualLabel {
      font-size: 12px;
      font-weight: 800;
      color: #9fb0bf;
      margin-bottom: 8px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    #manualNIIN {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #41586b;
      background: #ffffff;
      color: #10243a;
      font-size: 18px;
      box-sizing: border-box;
    }

    #manualNIIN:focus {
      outline: none;
      border-color: var(--green);
      box-shadow:
        0 0 0 2px rgba(99,209,63,.15);
    }

    .manualButton {
      width: 100%;
      margin-top: 10px;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #315a71,
          #3e697d
        );

      color: white;
      font-size: 16px;
      font-weight: 800;
    }


    /* =========================
       STATUS
       ========================= */

    .statusPanel {
      margin-top: 16px;

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

      border-top: 3px solid var(--red);
      border-radius: 11px;
      padding: 17px;
      text-align: center;
    }

    .statusMain {
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .statusSub {
      margin-top: 5px;
      color: #c5d0d8;
      font-size: 14px;
    }

    .success {
      background:
        linear-gradient(
          135deg,
          #0e4a28,
          #113c28
        );
    }

    .success .statusMain {
      color: #9aff7b;
    }


    /* =========================
       RESULT PANEL
       ========================= */

    .resultPanel {
      display: none;
      margin-top: 16px;
      background: #f4f7f9;
      color: #10243a;
      border-radius: 10px;
      padding: 16px;
      border-left: 5px solid var(--green);
    }

    .resultLabel {
      font-size: 11px;
      font-weight: 800;
      color: #6c7a86;
      text-transform: uppercase;
    }

    #resultNIIN {
      font-size: 25px;
      font-weight: 900;
      margin-top: 3px;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #8295a5;
      font-size: 12px;

      padding-bottom:
        max(
          8px,
          env(safe-area-inset-bottom)
        );
    }


    /* =========================
       MOBILE
       ========================= */

    @media(max-width:520px) {

      .logo {
        width: 64px;
        height: 64px;
      }

      .title {
        font-size: 21px;
      }

      .subtitle {
        font-size: 12px;
      }

      .secure {
        display: none;
      }

      #reader {
        min-height: 290px;
      }

      .controlRow {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

  <img
    class="logo"
    src="rainier-dustoff.png"
    alt="Rainier DUSTOFF"
  >

  <div class="headerText">

    <div class="title">
      C1-168 INVENTORY
    </div>

    <div class="subtitle">
      Det 2 • C Co • 1-168 GSAB
    </div>

  </div>

  <div class="secure">
    🔒 SECURE
  </div>

</div>



<div class="page">


  <!-- =========================
       INTRO
       ========================= -->

  <div class="scanIntro">

    <div class="scanIcon">
      ⌗
    </div>

    <div class="scanTitle">
      SCAN ITEM QR CODE
    </div>

    <div class="scanSubtitle">
      Rear camera opens automatically
    </div>

  </div>



  <!-- =========================
       CAMERA
       ========================= -->

  <div class="scannerShell">

    <div id="reader"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

  </div>



  <!-- =========================
       CAMERA CONTROLS
       ========================= -->

  <div class="controlRow">

    <button
      class="secondaryButton"
      onclick="startScanner()"
    >
      📷 START CAMERA
    </button>

    <button
      class="restartButton"
      onclick="restartScanner()"
    >
      ↻ RESTART SCANNER
    </button>

  </div>



  <!-- =========================
       MANUAL ENTRY
       ========================= -->

  <div class="manualPanel">

    <div class="manualLabel">
      Or Enter NIIN Manually
    </div>

    <input
      type="text"
      id="manualNIIN"
      placeholder="Enter NIIN"
      inputmode="numeric"
      autocomplete="off"
      onkeydown="
        if(event.key === 'Enter') {
          submitManualNIIN();
        }
      "
    >

    <button
      class="manualButton"
      onclick="submitManualNIIN()"
    >
      FIND ITEM
    </button>

  </div>



  <!-- =========================
       STATUS
       ========================= -->

  <div
    id="statusPanel"
    class="statusPanel"
  >

    <div
      id="statusMain"
      class="statusMain"
    >
      READY TO SCAN
    </div>

    <div
      id="statusSub"
      class="statusSub"
    >
      Point the rear camera at an inventory QR
    </div>

  </div>



  <!-- =========================
       RESULT
       ========================= -->

  <div
    id="resultPanel"
    class="resultPanel"
  >

    <div class="resultLabel">
      NIIN Detected
    </div>

    <div id="resultNIIN">
    </div>

  </div>



  <div class="footer">
    🔒 Secure • Rainier DUSTOFF Inventory Scanner
  </div>


</div>



<script>


let scanner = null;
let scanComplete = false;


/* =========================================
   EXTRACT NIIN
   ========================================= */

function extractNIIN(
  data
) {

  let niin = "";


  try {

    const url =
      new URL(
        data
      );


    niin =
      url
        .searchParams
        .get(
          "niin"
        ) || "";

  }


  catch(error) {

    niin =
      String(
        data || ""
      );

  }


  niin =
    String(
      niin
    )
    .replace(
      /[^0-9]/g,
      ""
    );


  return niin;

}



/* =========================================
   DISPLAY RESULT
   ========================================= */

function showNIIN(
  niin
) {

  localStorage.setItem(
    "lastScannedNIIN",
    niin
  );


  document
    .getElementById(
      "resultNIIN"
    )
    .textContent =
    niin;


  document
    .getElementById(
      "resultPanel"
    )
    .style
    .display =
    "block";


  setStatus(
    "ITEM FOUND",
    "NIIN: " + niin,
    true
  );

}



/* =========================================
   QR SCAN SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText
) {

  if (
    scanComplete
  ) {

    return;

  }


  const niin =
    extractNIIN(
      decodedText
    );


  if (
    !niin
  ) {

    setStatus(
      "QR DETECTED",
      "No NIIN was found in this QR code.",
      false
    );

    return;

  }


  scanComplete =
    true;


  showNIIN(
    niin
  );

}



/* =========================================
   START REAR CAMERA
   ========================================= */

async function startScanner() {

  scanComplete =
    false;


  document
    .getElementById(
      "resultPanel"
    )
    .style
    .display =
    "none";


  setStatus(
    "STARTING CAMERA",
    "Opening rear camera...",
    false
  );


  try {


    if (
      scanner
    ) {

      try {

        await scanner.stop();

      }

      catch(error) {}


      try {

        await scanner.clear();

      }

      catch(error) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
    Prefer rear/environment camera.
    */


    const cameraConfig = {

      facingMode: {

        ideal:
          "environment"

      }

    };


    const scanConfig = {

      fps:
        15,


      qrbox:
        function(
          width,
          height
        ) {


          const size =
            Math.floor(

              Math.min(
                width,
                height
              )

              * .72

            );


          return {

            width:
              size,

            height:
              size

          };

        },


      aspectRatio:
        1.333333,


      disableFlip:
        true

    };


    await scanner.start(

      cameraConfig,

      scanConfig,

      onScanSuccess,

      function(errorMessage) {

        /*
        Normal scanning failures
        are intentionally ignored.
        */

      }

    );


    setStatus(
      "READY TO SCAN",
      "Rear camera active • Point at inventory QR",
      false
    );


  }


  catch(error) {


    console.error(
      error
    );


    setStatus(
      "CAMERA ACCESS REQUIRED",
      "Allow camera permission in Safari, then tap START CAMERA.",
      false
    );


  }

}



/* =========================================
   RESTART SCANNER
   ========================================= */

async function restartScanner() {

  scanComplete =
    false;


  await startScanner();

}



/* =========================================
   MANUAL NIIN
   ========================================= */

function submitManualNIIN() {


  let niin =
    String(

      document
        .getElementById(
          "manualNIIN"
        )
        .value ||

      ""

    );


  niin =
    niin.replace(
      /[^0-9]/g,
      ""
    );


  if (
    !niin
  ) {


    setStatus(
      "ENTER NIIN",
      "Type a valid NIIN and try again.",
      false
    );


    return;

  }


  scanComplete =
    true;


  showNIIN(
    niin
  );

}



/* =========================================
   STATUS
   ========================================= */

function setStatus(
  main,
  sub,
  success
) {


  const panel =
    document
      .getElementById(
        "statusPanel"
      );


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    main;


  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    sub;


  if (
    success
  ) {

    panel
      .classList
      .add(
        "success"
      );

  }


  else {

    panel
      .classList
      .remove(
        "success"
      );

  }

}



/* =========================================
   AUTO START
   ========================================= */

window.addEventListener(

  "load",

  function() {

    startScanner();

  }

);


</script>


</body>

</html>
