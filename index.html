<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>C1-168 Inventory Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    :root {
      --navy: #031729;
      --navy2: #082c49;
      --red: #d71920;
      --green: #63d13f;
      --panel: #0c1f31;
      --panel2: #10283d;
      --muted: #9fb0bf;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020d17;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }


    /* =========================================
       HEADER
       ========================================= */

    .header {

      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      border-bottom:
        4px solid var(--red);

      padding:
        max(14px, env(safe-area-inset-top))
        18px
        14px;

      display: flex;
      align-items: center;
      gap: 14px;

    }

    .logo {

      width: 70px;
      height: 70px;

      object-fit: contain;

      border-radius: 50%;

      flex-shrink: 0;

    }

    .headerText {
      flex: 1;
    }

    .title {

      font-size: 24px;
      font-weight: 900;
      letter-spacing: .4px;

    }

    .subtitle {

      margin-top: 4px;

      font-size: 13px;

      color: #c7d1d9;

    }

    .secure {

      font-size: 11px;

      color: #aebbc5;

    }


    /* =========================================
       MAIN PAGE
       ========================================= */

    .page {

      max-width: 680px;

      margin: 0 auto;

      padding:
        20px
        16px
        36px;

    }


    /* =========================================
       SCANNER INTRO
       ========================================= */

    .scanIntro {

      text-align: center;

      margin-bottom: 18px;

    }

    .scanIcon {

      color: var(--green);

      font-size: 38px;

      margin-bottom: 5px;

    }

    .scanTitle {

      font-size: 23px;

      font-weight: 900;

    }

    .scanSubtitle {

      margin-top: 7px;

      color: #bdc8d0;

      font-size: 14px;

    }


    /* =========================================
       START SCANNER
       ========================================= */

    .startButton {

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 10px;

      margin-bottom: 15px;

      background:
        linear-gradient(
          135deg,
          #247c3b,
          #1a612e
        );

      color: white;

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;

    }


    /* =========================================
       CAMERA
       ========================================= */

    .scannerShell {

      position: relative;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      border:
        1px solid #425466;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    }

    #reader {

      width: 100%;

      min-height: 320px;

      background: #000;

    }

    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover !important;

    }


    /* =========================================
       GREEN SCAN CORNERS
       ========================================= */

    .corner {

      position: absolute;

      width: 44px;

      height: 44px;

      z-index: 20;

      pointer-events: none;

    }

    .tl {

      top: 12px;
      left: 12px;

      border-top:
        4px solid var(--green);

      border-left:
        4px solid var(--green);

    }

    .tr {

      top: 12px;
      right: 12px;

      border-top:
        4px solid var(--green);

      border-right:
        4px solid var(--green);

    }

    .bl {

      bottom: 12px;
      left: 12px;

      border-bottom:
        4px solid var(--green);

      border-left:
        4px solid var(--green);

    }

    .br {

      bottom: 12px;
      right: 12px;

      border-bottom:
        4px solid var(--green);

      border-right:
        4px solid var(--green);

    }


    /* =========================================
       CAMERA CONTROLS
       ========================================= */

    .cameraControls {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 12px;

    }

    button {

      border: none;

      border-radius: 8px;

      padding: 14px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }

    .restartButton {

      background:
        #315a71;

      color: white;

    }

    .stopButton {

      background:
        #46252a;

      color: white;

    }


    /* =========================================
       CAMERA INFO
       ========================================= */

    .cameraInfo {

      margin-top: 12px;

      padding: 10px;

      border-radius: 8px;

      background: #091725;

      color: #9fb0bf;

      font-size: 11px;

      text-align: center;

    }


    /* =========================================
       MANUAL NIIN
       ========================================= */

    .manualPanel {

      margin-top: 16px;

      padding: 15px;

      border-radius: 11px;

      border:
        1px solid #314a5f;

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

    }

    .manualLabel {

      margin-bottom: 8px;

      font-size: 12px;

      font-weight: 800;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: .5px;

    }

    #manualNIIN {

      width: 100%;

      padding: 13px;

      border:
        1px solid #41586b;

      border-radius: 8px;

      font-size: 18px;

      background: white;

      color: #10243a;

    }

    #manualNIIN:focus {

      outline: none;

      border-color:
        var(--green);

    }

    .manualButton {

      width: 100%;

      margin-top: 10px;

      background:
        #315a71;

      color: white;

    }


    /* =========================================
       STATUS
       ========================================= */

    .statusPanel {

      margin-top: 16px;

      padding: 17px;

      text-align: center;

      border-radius: 11px;

      border-top:
        3px solid var(--red);

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

    }

    .statusMain {

      color: var(--green);

      font-size: 21px;

      font-weight: 900;

    }

    .statusSub {

      margin-top: 5px;

      color: #c5d0d8;

      font-size: 14px;

    }

    .statusPanel.success {

      background:
        linear-gradient(
          135deg,
          #0e4a28,
          #113c28
        );

    }


    /* =========================================
       LOADING OVERLAY
       ========================================= */

    #loadingOverlay {

      display: none;

      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 9999;

      background:
        rgba(3, 23, 41, .96);

      align-items: center;

      justify-content: center;

      flex-direction: column;

      text-align: center;

      padding: 30px;

    }

    .loadingCheck {

      width: 74px;
      height: 74px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        #247c3b;

      font-size: 42px;

      margin-bottom: 20px;

    }

    .loadingTitle {

      font-size: 26px;

      font-weight: 900;

    }

    .loadingNIIN {

      margin-top: 8px;

      font-size: 19px;

      color: #9aff7b;

      font-weight: 800;

    }

    .loadingSub {

      margin-top: 10px;

      color: #c5d0d8;

      font-size: 14px;

    }


    /* =========================================
       FOOTER
       ========================================= */

    .footer {

      margin-top: 20px;

      text-align: center;

      color: #8295a5;

      font-size: 12px;

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media(max-width:520px) {

      .logo {

        width: 62px;
        height: 62px;

      }

      .title {

        font-size: 20px;

      }

      .secure {

        display: none;

      }

      #reader {

        min-height: 290px;

      }

      .cameraControls {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>



<body>


<!-- =========================================
     HEADER
     ========================================= -->

<div class="header">

  <img
    class="logo"
    src="rainier-dustoff.png"
    alt="Rainier DUSTOFF"
  >

  <div class="headerText">

    <div class="title">
      C1-168 INVENTORY
    </div>

    <div class="subtitle">
      Det 2 • C Co • 1-168 GSAB
    </div>

  </div>

  <div class="secure">
    🔒 SECURE
  </div>

</div>



<!-- =========================================
     PAGE
     ========================================= -->

<div class="page">


  <div class="scanIntro">

    <div class="scanIcon">
      ⌗
    </div>

    <div class="scanTitle">
      SCAN ITEM QR CODE
    </div>

    <div class="scanSubtitle">
      Scan QR or enter NIIN manually
    </div>

  </div>



  <!-- START SCANNER -->

  <button
    class="startButton"
    onclick="startScanner()"
  >
    📷 START SCANNER
  </button>



  <!-- CAMERA -->

  <div class="scannerShell">

    <div id="reader"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

  </div>



  <!-- CAMERA CONTROLS -->

  <div class="cameraControls">

    <button
      class="restartButton"
      onclick="restartScanner()"
    >
      ↻ RESTART CAMERA
    </button>

    <button
      class="stopButton"
      onclick="stopScanner()"
    >
      ■ STOP CAMERA
    </button>

  </div>



  <div
    id="cameraInfo"
    class="cameraInfo"
  >
    Camera not started
  </div>



  <!-- MANUAL NIIN -->

  <div class="manualPanel">

    <div class="manualLabel">
      Or Enter NIIN Manually
    </div>

    <input
      type="text"
      id="manualNIIN"
      placeholder="Enter NIIN"
      inputmode="numeric"
      autocomplete="off"
      onkeydown="
        if(event.key === 'Enter') {
          submitManualNIIN();
        }
      "
    >

    <button
      class="manualButton"
      onclick="submitManualNIIN()"
    >
      FIND ITEM
    </button>

  </div>



  <!-- STATUS -->

  <div
    id="statusPanel"
    class="statusPanel"
  >

    <div
      id="statusMain"
      class="statusMain"
    >
      READY
    </div>

    <div
      id="statusSub"
      class="statusSub"
    >
      Tap START SCANNER or enter a NIIN
    </div>

  </div>



  <div class="footer">
    🔒 Secure • Rainier DUSTOFF Inventory System
  </div>


</div>



<!-- =========================================
     LOADING / REDIRECT SCREEN
     ========================================= -->

<div id="loadingOverlay">

  <div class="loadingCheck">
    ✓
  </div>

  <div class="loadingTitle">
    ITEM FOUND
  </div>

  <div
    id="loadingNIIN"
    class="loadingNIIN"
  >
  </div>

  <div class="loadingSub">
    Opening inventory record...
  </div>

</div>



<script>


/* =========================================
   INVENTORY APPLICATION URL

   This is the working production deployment.
   ========================================= */

const INVENTORY_APP_URL =
  "https://script.google.com/macros/s/AKfycbxj7jacUxVhAnMOgguKCWc-QOhlB0QZLb9T0QFMPTwX4v5cCICtQB_UkBY5gt1ZeJ8t/exec";



let scanner =
  null;


let scannerRunning =
  false;


let scanComplete =
  false;


let redirectStarted =
  false;



/* =========================================
   EXTRACT NIIN FROM QR

   Supports:

   015326656

   OR

   https://....../exec?niin=015326656
   ========================================= */

function extractNIIN(
  data
) {


  let niin =
    "";


  try {


    const url =
      new URL(
        data
      );


    niin =
      url
        .searchParams
        .get(
          "niin"
        ) || "";


  }


  catch(error) {


    niin =
      String(
        data || ""
      );


  }


  niin =
    String(
      niin
    )
    .replace(
      /[^0-9]/g,
      ""
    );


  return niin;

}



/* =========================================
   OPEN INVENTORY ITEM
   ========================================= */

function openInventoryItem(
  niin
) {


  if (
    redirectStarted
  ) {

    return;

  }


  redirectStarted =
    true;


  scanComplete =
    true;


  /*
  Save NIIN locally as backup.
  */


  localStorage.setItem(
    "lastScannedNIIN",
    niin
  );


  /*
  Show transition screen.
  */


  document
    .getElementById(
      "loadingNIIN"
    )
    .textContent =
    "NIIN " + niin;


  document
    .getElementById(
      "loadingOverlay"
    )
    .style
    .display =
    "flex";


  /*
  Build inventory URL.
  */


  const destination =
    INVENTORY_APP_URL
    +
    "?niin="
    +
    encodeURIComponent(
      niin
    );


  /*
  Brief visual transition.

  Then immediately move to
  inventory application.
  */


  setTimeout(

    function() {


      window.location.replace(
        destination
      );


    },

    350

  );

}



/* =========================================
   QR SCAN SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText
) {


  if (
    scanComplete ||
    redirectStarted
  ) {

    return;

  }


  const niin =
    extractNIIN(
      decodedText
    );


  if (
    !niin
  ) {


    setStatus(
      "QR DETECTED",
      "QR read successfully, but no NIIN was found.",
      false
    );


    return;

  }


  /*
  THIS IS THE IMPORTANT PART:

  The scanner no longer displays
  the NIIN at the bottom.

  It immediately opens the
  inventory item.
  */


  openInventoryItem(
    niin
  );

}



/* =========================================
   CHOOSE BEST CAMERA
   ========================================= */

function chooseBestCamera(
  cameras
) {


  if (
    !cameras ||
    cameras.length === 0
  ) {

    return null;

  }


  const ranked =
    cameras.map(

      function(camera) {


        const label =
          String(
            camera.label || ""
          )
          .toLowerCase();


        let score =
          0;


        /*
        Strongly prefer rear cameras.
        */


        if (
          label.includes(
            "back"
          )
        ) {

          score +=
            100;

        }


        if (
          label.includes(
            "rear"
          )
        ) {

          score +=
            100;

        }


        /*
        Prefer standard wide camera.
        */


        if (
          label.includes(
            "wide"
          )
        ) {

          score +=
            30;

        }


        if (
          label.includes(
            "dual"
          )
        ) {

          score +=
            15;

        }


        /*
        Avoid front/selfie.
        */


        if (
          label.includes(
            "front"
          )
        ) {

          score -=
            200;

        }


        if (
          label.includes(
            "selfie"
          )
        ) {

          score -=
            200;

        }


        /*
        Avoid specialty lenses
        when possible.
        */


        if (
          label.includes(
            "ultra"
          )
        ) {

          score -=
            80;

        }


        if (
          label.includes(
            "telephoto"
          )
        ) {

          score -=
            80;

        }


        if (
          label.includes(
            "macro"
          )
        ) {

          score -=
            80;

        }


        return {

          camera:
            camera,

          score:
            score

        };

      }

    );


  ranked.sort(

    function(a,b) {

      return (
        b.score -
        a.score
      );

    }

  );


  return ranked[0].camera;

}



/* =========================================
   START SCANNER
   ========================================= */

async function startScanner() {


  scanComplete =
    false;


  redirectStarted =
    false;


  setStatus(
    "CAMERA PERMISSION",
    "Allow camera access if Safari asks.",
    false
  );


  try {


    /*
    Stop existing scanner.
    */


    if (
      scannerRunning &&
      scanner
    ) {


      try {

        await scanner.stop();

      }

      catch(error) {}


      scannerRunning =
        false;

    }



    /*
    Create scanner.
    */


    scanner =
      new Html5Qrcode(
        "reader"
      );



    /*
    Ask browser for available cameras.
    */


    const cameras =
      await Html5Qrcode
        .getCameras();



    if (
      !cameras ||
      cameras.length === 0
    ) {


      throw new Error(
        "No cameras detected."
      );

    }



    /*
    Pick best rear camera.
    */


    const bestCamera =
      chooseBestCamera(
        cameras
      );


    let cameraConfig;



    if (
      bestCamera
    ) {


      cameraConfig =
        bestCamera.id;


      document
        .getElementById(
          "cameraInfo"
        )
        .textContent =

        "Camera: "
        +
        (
          bestCamera.label ||
          "Rear Camera"
        );

    }


    else {


      cameraConfig = {

        facingMode:
          "environment"

      };


      document
        .getElementById(
          "cameraInfo"
        )
        .textContent =
        "Camera: Rear / Environment";

    }



    /*
    SIMPLE FULL-FRAME SCANNING

    This intentionally avoids qrbox
    and forced aspect ratio.
    */


    const scanConfig = {

      fps:
        10

    };



    await scanner.start(

      cameraConfig,

      scanConfig,

      onScanSuccess,

      function(errorMessage) {

        /*
        Normal frame misses are expected.

        Do nothing and allow scanner
        to continue searching.
        */

      }

    );



    scannerRunning =
      true;



    setStatus(
      "READY TO SCAN",
      "Point the camera at an inventory QR code.",
      false
    );


  }


  catch(error) {


    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "cameraInfo"
      )
      .textContent =
      "Camera unavailable";


    setStatus(
      "CAMERA ACCESS FAILED",
      String(
        error.message ||
        error
      ),
      false
    );


  }

}



/* =========================================
   STOP CAMERA
   ========================================= */

async function stopScanner() {


  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  try {


    await scanner.stop();


    scannerRunning =
      false;


    document
      .getElementById(
        "cameraInfo"
      )
      .textContent =
      "Camera stopped";


    setStatus(
      "CAMERA STOPPED",
      "Tap START SCANNER to scan another item.",
      false
    );


  }


  catch(error) {


    console.error(
      error
    );


  }

}



/* =========================================
   RESTART CAMERA
   ========================================= */

async function restartScanner() {


  await stopScanner();


  await startScanner();

}



/* =========================================
   MANUAL NIIN

   Manual entry uses EXACTLY the same
   inventory handoff as QR scanning.
   ========================================= */

function submitManualNIIN() {


  let niin =
    String(

      document
        .getElementById(
          "manualNIIN"
        )
        .value ||

      ""

    );


  niin =
    niin.replace(
      /[^0-9]/g,
      ""
    );


  if (
    !niin
  ) {


    setStatus(
      "ENTER NIIN",
      "Enter a valid NIIN.",
      false
    );


    return;

  }


  /*
  Same destination as QR scan.
  */


  openInventoryItem(
    niin
  );

}



/* =========================================
   STATUS DISPLAY
   ========================================= */

function setStatus(
  main,
  sub,
  success
) {


  const panel =
    document
      .getElementById(
        "statusPanel"
      );


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    main;


  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    sub;


  if (
    success
  ) {


    panel
      .classList
      .add(
        "success"
      );


  }


  else {


    panel
      .classList
      .remove(
        "success"
      );


  }

}


</script>


</body>

</html>
