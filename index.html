<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>C1-168 Inventory Scanner</title>


  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    :root {
      --navy: #031729;
      --navy2: #082c49;
      --red: #d71920;
      --green: #2d9447;
      --green-bright: #72dc57;
      --panel: #0c1f31;
      --panel2: #10283d;
      --muted: #9fb0bf;
      --white: #ffffff;
      --light: #eef1f4;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #020d17,
          #041523
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }



    /* =========================================
       HEADER
       ========================================= */

    .header {

      display: flex;
      align-items: center;
      gap: 15px;

      padding:
        max(13px, env(safe-area-inset-top))
        17px
        14px;

      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      border-bottom:
        4px solid var(--red);
    }


    .home-logo {
      display: block;
      flex-shrink: 0;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;
    }


    .logo {

      display: block;

      width: 74px;
      height: 74px;

      object-fit: contain;

      border-radius: 50%;
    }


    .header-copy {
      flex: 1;
      min-width: 0;
    }


    .title {

      margin: 0;

      font-size: 26px;
      line-height: 1.05;

      font-weight: 900;

      letter-spacing: .4px;
    }


    .subtitle {

      margin-top: 6px;

      color: #ccd6de;

      font-size: 14px;
    }



    /* =========================================
       PAGE
       ========================================= */

    .page {

      width: 100%;
      max-width: 680px;

      margin: 0 auto;

      padding:
        20px
        15px
        40px;
    }



    /* =========================================
       INTRO
       ========================================= */

    .intro {

      margin-bottom: 18px;

      text-align: center;
    }


    .scan-symbol {

      color:
        var(--green-bright);

      font-size: 36px;

      line-height: 1;
    }


    .intro-title {

      margin-top: 5px;

      font-size: 23px;

      font-weight: 900;
    }


    .intro-subtitle {

      margin-top: 7px;

      color: #b8c6d0;

      font-size: 14px;
    }



    /* =========================================
       START BUTTON
       ========================================= */

    .start-button {

      width: 100%;

      margin-bottom: 14px;

      padding: 17px;

      border: 0;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #288a41,
          #1c6931
        );

      color: white;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;
    }


    .start-button:disabled {

      opacity: .6;

      cursor: default;
    }



    /* =========================================
       CAMERA
       ========================================= */

    .scanner-shell {

      position: relative;

      overflow: hidden;

      min-height: 320px;

      background: #000;

      border:
        1px solid #43586a;

      border-radius: 15px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);
    }


    #reader {

      width: 100%;

      min-height: 320px;

      background: #000;
    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover !important;
    }



    /* Decorative green corners */

    .corner {

      position: absolute;

      width: 46px;
      height: 46px;

      z-index: 10;

      pointer-events: none;
    }


    .top-left {

      top: 13px;
      left: 13px;

      border-top:
        4px solid var(--green-bright);

      border-left:
        4px solid var(--green-bright);
    }


    .top-right {

      top: 13px;
      right: 13px;

      border-top:
        4px solid var(--green-bright);

      border-right:
        4px solid var(--green-bright);
    }


    .bottom-left {

      bottom: 13px;
      left: 13px;

      border-bottom:
        4px solid var(--green-bright);

      border-left:
        4px solid var(--green-bright);
    }


    .bottom-right {

      bottom: 13px;
      right: 13px;

      border-bottom:
        4px solid var(--green-bright);

      border-right:
        4px solid var(--green-bright);
    }



    /* =========================================
       CAMERA CONTROLS
       ========================================= */

    .camera-controls {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

      margin-top: 12px;
    }


    .control-button {

      padding: 14px;

      border: 0;

      border-radius: 8px;

      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;
    }


    .restart-button {

      background: #315a71;
    }


    .stop-button {

      background: #512a2f;
    }



    /* =========================================
       CAMERA INFO
       ========================================= */

    .camera-info {

      margin-top: 11px;

      padding: 10px 12px;

      border-radius: 8px;

      background: #091725;

      color: #9fb0bf;

      font-size: 11px;

      text-align: center;
    }



    /* =========================================
       MANUAL NIIN
       ========================================= */

    .manual-panel {

      margin-top: 17px;

      padding: 16px;

      border:
        1px solid #314a5f;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );
    }


    .manual-label {

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 900;

      letter-spacing: .6px;

      text-transform: uppercase;
    }


    #manual-niin {

      width: 100%;

      padding: 14px;

      border:
        1px solid #405a6f;

      border-radius: 8px;

      background: white;

      color: #10243a;

      font-size: 18px;
    }


    #manual-niin:focus {

      outline: none;

      border-color:
        var(--green-bright);
    }


    .find-button {

      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: 0;

      border-radius: 8px;

      background: #315a71;

      color: white;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
    }



    /* =========================================
       STATUS
       ========================================= */

    .status-panel {

      margin-top: 17px;

      padding: 17px;

      border-top:
        3px solid var(--red);

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

      text-align: center;
    }


    .status-main {

      color:
        var(--green-bright);

      font-size: 20px;

      font-weight: 900;
    }


    .status-sub {

      margin-top: 5px;

      color: #c3cfd7;

      font-size: 14px;
    }


    .status-panel.error {

      background:
        linear-gradient(
          135deg,
          #4d2025,
          #37171b
        );
    }


    .status-panel.success {

      background:
        linear-gradient(
          135deg,
          #124b2a,
          #103a24
        );
    }



    /* =========================================
       REDIRECT OVERLAY
       ========================================= */

    #redirect-overlay {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      padding: 30px;

      background:
        rgba(3,23,41,.97);

      text-align: center;
    }


    .check-circle {

      display: flex;

      align-items: center;
      justify-content: center;

      width: 76px;
      height: 76px;

      margin-bottom: 20px;

      border-radius: 50%;

      background: #278642;

      font-size: 42px;
    }


    .redirect-title {

      font-size: 27px;

      font-weight: 900;
    }


    #redirect-niin {

      margin-top: 8px;

      color: #91ef76;

      font-size: 20px;
      font-weight: 900;
    }


    .redirect-subtitle {

      margin-top: 9px;

      color: #c5d0d8;

      font-size: 14px;
    }



    /* =========================================
       FOOTER
       ========================================= */

    .footer {

      margin-top: 22px;

      color: #8295a5;

      font-size: 12px;

      text-align: center;
    }



    /* =========================================
       MOBILE
       ========================================= */

    @media
    (max-width: 520px) {


      .logo {

        width: 64px;

        height: 64px;
      }


      .title {

        font-size: 21px;
      }


      .subtitle {

        font-size: 12px;
      }


      .scanner-shell,
      #reader {

        min-height: 290px;
      }


      .camera-controls {

        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header class="header">


    <a
      class="home-logo"
      href="https://zanellatrevor-pixel.github.io/inventory-qr-scanner/"
      aria-label="Scanner home"
    >

      <img
        class="logo"
        src="rainier-dustoff.png"
        alt="Rainier DUSTOFF"
      >

    </a>


    <div class="header-copy">

      <h1 class="title">
        C1-168 INVENTORY
      </h1>

      <div class="subtitle">
        Det 2 • C Co • 1-168 GSAB
      </div>

    </div>


  </header>



  <!-- =========================================
       MAIN
       ========================================= -->

  <main class="page">


    <section class="intro">

      <div class="scan-symbol">
        ⌗
      </div>

      <div class="intro-title">
        SCAN ITEM QR CODE
      </div>

      <div class="intro-subtitle">
        Scan an inventory QR or enter the NIIN manually
      </div>

    </section>



    <!-- START -->

    <button
      id="start-button"
      class="start-button"
      type="button"
    >
      📷 START SCANNER
    </button>



    <!-- CAMERA -->

    <div class="scanner-shell">

      <div id="reader"></div>

      <div class="corner top-left"></div>

      <div class="corner top-right"></div>

      <div class="corner bottom-left"></div>

      <div class="corner bottom-right"></div>

    </div>



    <!-- CAMERA CONTROLS -->

    <div class="camera-controls">

      <button
        id="restart-button"
        class="control-button restart-button"
        type="button"
      >
        ↻ RESTART CAMERA
      </button>


      <button
        id="stop-button"
        class="control-button stop-button"
        type="button"
      >
        ■ STOP CAMERA
      </button>

    </div>



    <div
      id="camera-info"
      class="camera-info"
    >
      Camera not started
    </div>



    <!-- MANUAL -->

    <section class="manual-panel">

      <div class="manual-label">
        Or Enter NIIN Manually
      </div>

      <input
        id="manual-niin"
        type="text"
        placeholder="Enter NIIN"
        inputmode="numeric"
        autocomplete="off"
      >

      <button
        id="find-button"
        class="find-button"
        type="button"
      >
        FIND ITEM
      </button>

    </section>



    <!-- STATUS -->

    <section
      id="status-panel"
      class="status-panel"
    >

      <div
        id="status-main"
        class="status-main"
      >
        READY
      </div>

      <div
        id="status-sub"
        class="status-sub"
      >
        Tap START SCANNER or enter a NIIN
      </div>

    </section>



    <footer class="footer">
      🔒 Rainier DUSTOFF Inventory Scanner
    </footer>


  </main>



  <!-- =========================================
       REDIRECT
       ========================================= -->

  <div id="redirect-overlay">

    <div class="check-circle">
      ✓
    </div>

    <div class="redirect-title">
      ITEM FOUND
    </div>

    <div id="redirect-niin">
    </div>

    <div class="redirect-subtitle">
      Opening live inventory record...
    </div>

  </div>



  <script>


    /*
     ============================================================
     C1-168 GITHUB SCANNER

     This page does ONE job:

     QR / manual NIIN
              ↓
     production Apps Script inventory page
              ↓
     ?niin=XXXXXXXXX

     ============================================================
    */


    /* ----------------------------------------------------------
       WORKING PRODUCTION INVENTORY DEPLOYMENT
       ---------------------------------------------------------- */

    const INVENTORY_APP_URL =
      "https://script.google.com/macros/s/AKfycbzbxVUD35d6WIDDeMSCuFfZmSfnb7LNtvvmWC76K6w-L6334ZKwB5EO_uM1wFABdoWV/exec";



    /* ----------------------------------------------------------
       VARIABLES
       ---------------------------------------------------------- */

    let scanner =
      null;


    let scannerRunning =
      false;


    let redirectStarted =
      false;



    /* ----------------------------------------------------------
       ELEMENTS
       ---------------------------------------------------------- */

    const startButton =
      document.getElementById(
        "start-button"
      );


    const restartButton =
      document.getElementById(
        "restart-button"
      );


    const stopButton =
      document.getElementById(
        "stop-button"
      );


    const cameraInfo =
      document.getElementById(
        "camera-info"
      );


    const manualNIIN =
      document.getElementById(
        "manual-niin"
      );


    const findButton =
      document.getElementById(
        "find-button"
      );


    const statusPanel =
      document.getElementById(
        "status-panel"
      );


    const statusMain =
      document.getElementById(
        "status-main"
      );


    const statusSub =
      document.getElementById(
        "status-sub"
      );


    const redirectOverlay =
      document.getElementById(
        "redirect-overlay"
      );


    const redirectNIIN =
      document.getElementById(
        "redirect-niin"
      );



    /* ----------------------------------------------------------
       NIIN SANITIZER
       ---------------------------------------------------------- */

    function sanitizeNIIN(
      value
    ) {


      return String(
        value || ""
      )
      .replace(
        /[^0-9]/g,
        ""
      );


    }



    /* ----------------------------------------------------------
       EXTRACT NIIN FROM QR
       ----------------------------------------------------------

       Existing QR may contain:

       https://script.google.com/.../exec?niin=015326656

       OR simply:

       015326656

       ---------------------------------------------------------- */

    function extractNIIN(
      decodedText
    ) {


      const text =
        String(
          decodedText || ""
        )
        .trim();



      if (!text) {

        return "";

      }



      /*
       Try QR as URL first.
      */


      try {


        const url =
          new URL(
            text
          );


        const parameter =
          url.searchParams.get(
            "niin"
          );


        if (parameter) {


          return sanitizeNIIN(
            parameter
          );


        }


      }

      catch(error) {


        /*
         Not a URL.
         Continue below.
        */


      }



      /*
       Try finding ?niin= manually.
      */


      const match =
        text.match(
          /(?:\?|&|^)niin=([0-9]+)/i
        );


      if (
        match &&
        match[1]
      ) {


        return sanitizeNIIN(
          match[1]
        );


      }



      /*
       Finally treat QR contents
       as the NIIN itself.
      */


      return sanitizeNIIN(
        text
      );


    }



    /* ----------------------------------------------------------
       STATUS
       ---------------------------------------------------------- */

    function setStatus(
      main,
      sub,
      type = "normal"
    ) {


      statusMain.textContent =
        main;


      statusSub.textContent =
        sub;


      statusPanel.classList.remove(
        "error",
        "success"
      );


      if (
        type === "error"
      ) {


        statusPanel.classList.add(
          "error"
        );


      }


      if (
        type === "success"
      ) {


        statusPanel.classList.add(
          "success"
        );


      }


    }



    /* ----------------------------------------------------------
       REDIRECT TO LIVE INVENTORY
       ---------------------------------------------------------- */

    function openInventory(
      niin
    ) {


      niin =
        sanitizeNIIN(
          niin
        );


      if (!niin) {


        setStatus(
          "INVALID NIIN",
          "A valid NIIN was not detected.",
          "error"
        );


        return;


      }



      if (
        redirectStarted
      ) {


        return;


      }



      redirectStarted =
        true;



      /*
       Save backup.
      */


      localStorage.setItem(
        "lastScannedNIIN",
        niin
      );



      /*
       Show brief transition.
      */


      redirectNIIN.textContent =
        "NIIN " + niin;


      redirectOverlay.style.display =
        "flex";



      /*
       Build destination.
      */


      const destination =
        INVENTORY_APP_URL
        +
        "?niin="
        +
        encodeURIComponent(
          niin
        );



      /*
       Leave GitHub scanner and open
       the working Apps Script page.
      */


      setTimeout(

        function() {


          window.location.href =
            destination;


        },

        250

      );


    }



    /* ----------------------------------------------------------
       QR SUCCESS
       ---------------------------------------------------------- */

    function onScanSuccess(
      decodedText
    ) {


      if (
        redirectStarted
      ) {


        return;


      }



      const niin =
        extractNIIN(
          decodedText
        );



      if (!niin) {


        setStatus(
          "QR DETECTED",
          "The QR was read but did not contain a valid NIIN.",
          "error"
        );


        return;


      }



      setStatus(
        "ITEM FOUND",
        "NIIN " + niin,
        "success"
      );



      openInventory(
        niin
      );


    }



    /* ----------------------------------------------------------
       CHOOSE BEST CAMERA
       ---------------------------------------------------------- */

    function chooseBestCamera(
      cameras
    ) {


      if (
        !Array.isArray(cameras) ||
        cameras.length === 0
      ) {


        return null;


      }



      const ranked =
        cameras.map(

          function(camera) {


            const label =
              String(
                camera.label || ""
              )
              .toLowerCase();



            let score =
              0;



            /*
             Favor rear cameras.
            */


            if (
              label.includes(
                "back"
              )
            ) {

              score += 100;

            }


            if (
              label.includes(
                "rear"
              )
            ) {

              score += 100;

            }



            /*
             Favor normal wide camera.
            */


            if (
              label.includes(
                "wide"
              )
            ) {

              score += 25;

            }



            /*
             Penalize front camera.
            */


            if (
              label.includes(
                "front"
              )
            ) {

              score -= 200;

            }


            if (
              label.includes(
                "selfie"
              )
            ) {

              score -= 200;

            }



            /*
             Penalize specialty lenses
             when labels reveal them.
            */


            if (
              label.includes(
                "ultra"
              )
            ) {

              score -= 50;

            }


            if (
              label.includes(
                "telephoto"
              )
            ) {

              score -= 50;

            }


            if (
              label.includes(
                "macro"
              )
            ) {

              score -= 50;

            }



            return {

              camera:
                camera,

              score:
                score

            };


          }

        );



      ranked.sort(

        function(a,b) {


          return (
            b.score -
            a.score
          );


        }

      );



      return ranked[0].camera;


    }



    /* ----------------------------------------------------------
       STOP SCANNER
       ---------------------------------------------------------- */

    async function stopScanner() {


      if (
        !scanner ||
        !scannerRunning
      ) {


        return;


      }



      try {


        await scanner.stop();


      }


      catch(error) {


        console.log(
          error
        );


      }



      scannerRunning =
        false;



      cameraInfo.textContent =
        "Camera stopped";



      setStatus(
        "CAMERA STOPPED",
        "Tap START SCANNER to continue."
      );


    }



    /* ----------------------------------------------------------
       START SCANNER
       ---------------------------------------------------------- */

    async function startScanner() {


      if (
        redirectStarted
      ) {


        return;


      }



      startButton.disabled =
        true;



      setStatus(
        "STARTING CAMERA",
        "Allow camera access if your browser asks."
      );



      try {


        /*
         Stop previous session.
        */


        if (
          scannerRunning
        ) {


          await stopScanner();


        }



        /*
         Create fresh scanner object.
        */


        scanner =
          new Html5Qrcode(
            "reader"
          );



        /*
         Get camera list.
        */


        const cameras =
          await Html5Qrcode
            .getCameras();



        let cameraConfig;



        if (
          cameras &&
          cameras.length
        ) {


          const preferred =
            chooseBestCamera(
              cameras
            );



          if (preferred) {


            cameraConfig =
              preferred.id;



            cameraInfo.textContent =
              "Camera: "
              +
              (
                preferred.label ||
                "Rear Camera"
              );


          }


        }



        /*
         If camera enumeration gives us
         nothing useful, request the
         outward-facing camera.
        */


        if (!cameraConfig) {


          cameraConfig = {

            facingMode:
              "environment"

          };


          cameraInfo.textContent =
            "Camera: Rear / Environment";


        }



        /*
         Keep scanner config simple.

         Full video frame is scanned.
        */


        const scanConfig = {

          fps:
            10

        };



        await scanner.start(

          cameraConfig,

          scanConfig,

          onScanSuccess,

          function(errorMessage) {

            /*
             Normal frame scan misses
             are intentionally ignored.
            */

          }

        );



        scannerRunning =
          true;



        startButton.disabled =
          false;



        setStatus(
          "READY TO SCAN",
          "Point the rear camera at an inventory QR code."
        );


      }


      catch(error) {


        console.error(
          error
        );


        scannerRunning =
          false;


        startButton.disabled =
          false;


        cameraInfo.textContent =
          "Camera unavailable";


        setStatus(
          "CAMERA FAILED",
          error &&
          error.message

            ? error.message

            : String(error),

          "error"
        );


      }


    }



    /* ----------------------------------------------------------
       RESTART
       ---------------------------------------------------------- */

    async function restartScanner() {


      redirectStarted =
        false;


      await stopScanner();


      await startScanner();


    }



    /* ----------------------------------------------------------
       MANUAL NIIN
       ---------------------------------------------------------- */

    function submitManualNIIN() {


      const niin =
        sanitizeNIIN(
          manualNIIN.value
        );



      manualNIIN.value =
        niin;



      if (!niin) {


        setStatus(
          "ENTER NIIN",
          "Enter a valid NIIN.",
          "error"
        );


        return;


      }



      openInventory(
        niin
      );


    }



    /* ----------------------------------------------------------
       EVENTS
       ---------------------------------------------------------- */

    startButton.addEventListener(

      "click",

      startScanner

    );



    restartButton.addEventListener(

      "click",

      restartScanner

    );



    stopButton.addEventListener(

      "click",

      stopScanner

    );



    findButton.addEventListener(

      "click",

      submitManualNIIN

    );



    manualNIIN.addEventListener(

      "keydown",

      function(event) {


        if (
          event.key === "Enter"
        ) {


          event.preventDefault();


          submitManualNIIN();


        }


      }

    );



    /* ----------------------------------------------------------
       PAGE LOAD

       We intentionally do NOT automatically
       request camera permission.

       User taps START SCANNER.
       ---------------------------------------------------------- */

    window.addEventListener(

      "load",

      function() {


        redirectStarted =
          false;


        setStatus(
          "READY",
          "Tap START SCANNER or enter a NIIN."
        );


      }

    );


  </script>


</body>

</html>
