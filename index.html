<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>C1-168 Inventory Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    :root {
      --navy: #031729;
      --navy2: #082c49;
      --red: #d71920;
      --green: #63d13f;
      --panel: #0c1f31;
      --panel2: #10283d;
      --muted: #9fb0bf;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020d17;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }


    body {
      min-height: 100vh;
    }


    /* =========================
       HEADER
       ========================= */

    .header {

      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy2)
        );

      border-bottom:
        4px solid var(--red);

      padding:
        max(14px, env(safe-area-inset-top))
        18px
        14px;

      display: flex;
      align-items: center;
      gap: 14px;

    }


    .logo {

      width: 70px;
      height: 70px;

      object-fit: contain;

      border-radius: 50%;

      flex-shrink: 0;

    }


    .headerText {
      flex: 1;
    }


    .title {

      font-size: 24px;
      font-weight: 900;

      letter-spacing: .4px;

    }


    .subtitle {

      margin-top: 4px;

      font-size: 13px;

      color: #c7d1d9;

    }


    .secure {

      font-size: 11px;

      color: #aebbc5;

    }


    /* =========================
       MAIN
       ========================= */

    .page {

      max-width: 680px;

      margin: 0 auto;

      padding:
        20px
        16px
        36px;

    }


    .scanIntro {

      text-align: center;

      margin-bottom: 18px;

    }


    .scanIcon {

      color: var(--green);

      font-size: 38px;

      margin-bottom: 5px;

    }


    .scanTitle {

      font-size: 23px;

      font-weight: 900;

    }


    .scanSubtitle {

      margin-top: 7px;

      color: #bdc8d0;

      font-size: 14px;

    }


    /* =========================
       START BUTTON
       ========================= */

    .startButton {

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 10px;

      margin-bottom: 15px;

      background:
        linear-gradient(
          135deg,
          #247c3b,
          #1a612e
        );

      color: white;

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;

    }


    /* =========================
       CAMERA
       ========================= */

    .scannerShell {

      position: relative;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      border:
        1px solid #425466;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    }


    #reader {

      width: 100%;

      min-height: 320px;

      background: #000;

    }


    #reader video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover !important;

    }


    /* =========================
       SCAN CORNERS
       ========================= */

    .corner {

      position: absolute;

      width: 44px;

      height: 44px;

      z-index: 20;

      pointer-events: none;

    }


    .tl {

      top: 12px;
      left: 12px;

      border-top:
        4px solid var(--green);

      border-left:
        4px solid var(--green);

    }


    .tr {

      top: 12px;
      right: 12px;

      border-top:
        4px solid var(--green);

      border-right:
        4px solid var(--green);

    }


    .bl {

      bottom: 12px;
      left: 12px;

      border-bottom:
        4px solid var(--green);

      border-left:
        4px solid var(--green);

    }


    .br {

      bottom: 12px;
      right: 12px;

      border-bottom:
        4px solid var(--green);

      border-right:
        4px solid var(--green);

    }


    /* =========================
       CAMERA CONTROLS
       ========================= */

    .cameraControls {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top: 12px;

    }


    button {

      border: none;

      border-radius: 8px;

      padding: 14px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    .restartButton {

      background:
        #315a71;

      color: white;

    }


    .stopButton {

      background:
        #46252a;

      color: white;

    }


    /* =========================
       MANUAL ENTRY
       ========================= */

    .manualPanel {

      margin-top: 16px;

      padding: 15px;

      border-radius: 11px;

      border:
        1px solid #314a5f;

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

    }


    .manualLabel {

      margin-bottom: 8px;

      font-size: 12px;

      font-weight: 800;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: .5px;

    }


    #manualNIIN {

      width: 100%;

      padding: 13px;

      border:
        1px solid #41586b;

      border-radius: 8px;

      font-size: 18px;

      background: white;

      color: #10243a;

    }


    #manualNIIN:focus {

      outline: none;

      border-color:
        var(--green);

    }


    .manualButton {

      width: 100%;

      margin-top: 10px;

      background:
        #315a71;

      color: white;

    }


    /* =========================
       STATUS
       ========================= */

    .statusPanel {

      margin-top: 16px;

      padding: 17px;

      text-align: center;

      border-radius: 11px;

      border-top:
        3px solid var(--red);

      background:
        linear-gradient(
          135deg,
          var(--panel),
          var(--panel2)
        );

    }


    .statusMain {

      color: var(--green);

      font-size: 21px;

      font-weight: 900;

    }


    .statusSub {

      margin-top: 5px;

      color: #c5d0d8;

      font-size: 14px;

    }


    .statusPanel.success {

      background:
        linear-gradient(
          135deg,
          #0e4a28,
          #113c28
        );

    }


    /* =========================
       RESULT
       ========================= */

    .resultPanel {

      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 10px;

      border-left:
        5px solid var(--green);

      background: white;

      color: #10243a;

    }


    .resultLabel {

      font-size: 11px;

      font-weight: 800;

      color: #687784;

      text-transform: uppercase;

    }


    #resultNIIN {

      margin-top: 3px;

      font-size: 27px;

      font-weight: 900;

    }


    /* =========================
       DEBUG CAMERA INFO
       ========================= */

    .cameraInfo {

      margin-top: 12px;

      padding: 10px;

      border-radius: 8px;

      background: #091725;

      color: #9fb0bf;

      font-size: 11px;

      text-align: center;

    }


    /* =========================
       FOOTER
       ========================= */

    .footer {

      margin-top: 20px;

      text-align: center;

      color: #8295a5;

      font-size: 12px;

    }


    @media(max-width:520px) {

      .logo {

        width: 62px;
        height: 62px;

      }


      .title {

        font-size: 20px;

      }


      .secure {

        display: none;

      }


      #reader {

        min-height: 290px;

      }


      .cameraControls {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>



<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

  <img
    class="logo"
    src="rainier-dustoff.png"
    alt="Rainier DUSTOFF"
  >


  <div class="headerText">

    <div class="title">
      C1-168 INVENTORY
    </div>

    <div class="subtitle">
      Det 2 • C Co • 1-168 GSAB
    </div>

  </div>


  <div class="secure">
    🔒 SECURE
  </div>

</div>



<div class="page">


<!-- =========================
     INTRO
     ========================= -->

<div class="scanIntro">

  <div class="scanIcon">
    ⌗
  </div>

  <div class="scanTitle">
    SCAN ITEM QR CODE
  </div>

  <div class="scanSubtitle">
    Uses the normal rear camera when available
  </div>

</div>



<!-- =========================
     START SCANNER
     ========================= -->

<button
  class="startButton"
  onclick="startScanner()"
>
  📷 START SCANNER
</button>



<!-- =========================
     CAMERA
     ========================= -->

<div class="scannerShell">

  <div id="reader"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

</div>



<!-- =========================
     CAMERA CONTROLS
     ========================= -->

<div class="cameraControls">

  <button
    class="restartButton"
    onclick="restartScanner()"
  >
    ↻ RESTART CAMERA
  </button>


  <button
    class="stopButton"
    onclick="stopScanner()"
  >
    ■ STOP CAMERA
  </button>

</div>



<div
  id="cameraInfo"
  class="cameraInfo"
>
  Camera not started
</div>



<!-- =========================
     MANUAL NIIN
     ========================= -->

<div class="manualPanel">

  <div class="manualLabel">
    Or Enter NIIN Manually
  </div>


  <input
    type="text"
    id="manualNIIN"
    placeholder="Enter NIIN"
    inputmode="numeric"
    autocomplete="off"
    onkeydown="
      if(event.key === 'Enter') {
        submitManualNIIN();
      }
    "
  >


  <button
    class="manualButton"
    onclick="submitManualNIIN()"
  >
    FIND ITEM
  </button>

</div>



<!-- =========================
     STATUS
     ========================= -->

<div
  id="statusPanel"
  class="statusPanel"
>

  <div
    id="statusMain"
    class="statusMain"
  >
    READY
  </div>


  <div
    id="statusSub"
    class="statusSub"
  >
    Tap START SCANNER to enable the camera
  </div>

</div>



<!-- =========================
     RESULT
     ========================= -->

<div
  id="resultPanel"
  class="resultPanel"
>

  <div class="resultLabel">
    NIIN Detected
  </div>


  <div id="resultNIIN">
  </div>

</div>



<div class="footer">
  🔒 Secure • Rainier DUSTOFF Inventory Scanner
</div>


</div>



<script>


let scanner = null;

let scannerRunning =
  false;

let scanComplete =
  false;



/* =========================================
   EXTRACT NIIN
   ========================================= */

function extractNIIN(
  data
) {

  let niin =
    "";


  try {

    const url =
      new URL(
        data
      );


    niin =
      url
        .searchParams
        .get(
          "niin"
        ) || "";

  }


  catch(error) {

    niin =
      String(
        data || ""
      );

  }


  return String(
    niin
  )
  .replace(
    /[^0-9]/g,
    ""
  );

}



/* =========================================
   SHOW RESULT
   ========================================= */

function showNIIN(
  niin
) {

  localStorage.setItem(
    "lastScannedNIIN",
    niin
  );


  document
    .getElementById(
      "resultNIIN"
    )
    .textContent =
    niin;


  document
    .getElementById(
      "resultPanel"
    )
    .style
    .display =
    "block";


  setStatus(
    "ITEM FOUND",
    "NIIN: " + niin,
    true
  );

}



/* =========================================
   QR SUCCESS
   ========================================= */

function onScanSuccess(
  decodedText
) {

  if (
    scanComplete
  ) {

    return;

  }


  const niin =
    extractNIIN(
      decodedText
    );


  if (
    !niin
  ) {

    return;

  }


  scanComplete =
    true;


  showNIIN(
    niin
  );

}



/* =========================================
   CHOOSE BEST REAR CAMERA
   ========================================= */

function chooseBestCamera(
  cameras
) {


  if (
    !cameras ||
    cameras.length === 0
  ) {

    return null;

  }


  /*
  Build ranking system.

  Highest preference:
  normal rear/wide camera

  Lower preference:
  generic rear camera

  Avoid:
  front
  selfie
  ultra wide
  telephoto
  macro
  */


  let ranked =
    cameras.map(

      function(camera) {


        const label =
          String(
            camera.label || ""
          ).toLowerCase();


        let score =
          0;


        /*
        Rear camera preference
        */


        if (
          label.includes(
            "back"
          )
        ) {

          score +=
            100;

        }


        if (
          label.includes(
            "rear"
          )
        ) {

          score +=
            100;

        }


        /*
        Prefer normal wide camera
        */


        if (
          label.includes(
            "wide"
          )
        ) {

          score +=
            30;

        }


        /*
        Some iPhones label the normal
        camera as dual-wide.
        */


        if (
          label.includes(
            "dual"
          )
        ) {

          score +=
            15;

        }


        /*
        Avoid selfie/front
        */


        if (
          label.includes(
            "front"
          )
        ) {

          score -=
            200;

        }


        if (
          label.includes(
            "user"
          )
        ) {

          score -=
            200;

        }


        if (
          label.includes(
            "selfie"
          )
        ) {

          score -=
            200;

        }


        /*
        Avoid special rear lenses
        */


        if (
          label.includes(
            "ultra"
          )
        ) {

          score -=
            80;

        }


        if (
          label.includes(
            "telephoto"
          )
        ) {

          score -=
            80;

        }


        if (
          label.includes(
            "macro"
          )
        ) {

          score -=
            80;

        }


        return {

          camera:
            camera,

          score:
            score

        };

      }

    );


  ranked.sort(

    function(a,b) {

      return (
        b.score -
        a.score
      );

    }

  );


  return ranked[0].camera;

}



/* =========================================
   START SCANNER
   ========================================= */

async function startScanner() {


  scanComplete =
    false;


  document
    .getElementById(
      "resultPanel"
    )
    .style
    .display =
    "none";


  setStatus(
    "CAMERA PERMISSION",
    "Allow camera access when Safari asks.",
    false
  );


  try {


    /*
    Stop old scanner if needed.
    */


    if (
      scannerRunning &&
      scanner
    ) {

      try {

        await scanner.stop();

      }

      catch(error) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
    Request camera list.

    This also triggers browser
    permission if required.
    */


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No cameras detected."
      );

    }


    /*
    Find best rear camera.
    */


    const bestCamera =
      chooseBestCamera(
        cameras
      );


    let cameraConfig;


    if (
      bestCamera
    ) {


      cameraConfig =
        bestCamera.id;


      document
        .getElementById(
          "cameraInfo"
        )
        .textContent =

        "Camera: " +
        (
          bestCamera.label ||
          "Rear Camera"
        );

    }


    else {


      /*
      Fallback.
      */


      cameraConfig = {

        facingMode:
          "environment"

      };


      document
        .getElementById(
          "cameraInfo"
        )
        .textContent =
        "Camera: Rear / Environment";

    }



    /*
    Scanner configuration
    */


    const scanConfig = {


      fps:
        15,


      qrbox:
        function(
          width,
          height
        ) {


          const size =
            Math.floor(

              Math.min(
                width,
                height
              )

              * .75

            );


          return {

            width:
              size,

            height:
              size

          };

        },


      aspectRatio:
        1.333333,


      disableFlip:
        true

    };



    await scanner.start(

      cameraConfig,

      scanConfig,

      onScanSuccess,

      function(errorMessage) {

        /*
        QR scan failures are normal.
        Scanner keeps looking.
        */

      }

    );


    scannerRunning =
      true;


    setStatus(
      "READY TO SCAN",
      "Point the camera at an inventory QR code.",
      false
    );


  }


  catch(error) {


    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "cameraInfo"
      )
      .textContent =
      "Camera unavailable";


    setStatus(
      "CAMERA ACCESS FAILED",
      String(
        error.message ||
        error
      ),
      false
    );


  }

}



/* =========================================
   STOP SCANNER
   ========================================= */

async function stopScanner() {


  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  try {


    await scanner.stop();


    scannerRunning =
      false;


    setStatus(
      "CAMERA STOPPED",
      "Tap START SCANNER to begin again.",
      false
    );


    document
      .getElementById(
        "cameraInfo"
      )
      .textContent =
      "Camera stopped";


  }


  catch(error) {


    console.error(
      error
    );


  }

}



/* =========================================
   RESTART SCANNER
   ========================================= */

async function restartScanner() {


  await stopScanner();


  await startScanner();

}



/* =========================================
   MANUAL NIIN
   ========================================= */

function submitManualNIIN() {


  let niin =
    String(

      document
        .getElementById(
          "manualNIIN"
        )
        .value ||

      ""

    )
    .replace(
      /[^0-9]/g,
      ""
    );


  if (
    !niin
  ) {


    setStatus(
      "ENTER NIIN",
      "Type a valid NIIN.",
      false
    );


    return;

  }


  scanComplete =
    true;


  showNIIN(
    niin
  );

}



/* =========================================
   STATUS
   ========================================= */

function setStatus(
  main,
  sub,
  success
) {


  const panel =
    document
      .getElementById(
        "statusPanel"
      );


  document
    .getElementById(
      "statusMain"
    )
    .textContent =
    main;


  document
    .getElementById(
      "statusSub"
    )
    .textContent =
    sub;


  if (
    success
  ) {


    panel
      .classList
      .add(
        "success"
      );


  }


  else {


    panel
      .classList
      .remove(
        "success"
      );


  }

}



/* =========================================
   IMPORTANT:

   NO AUTO CAMERA START.

   User explicitly taps START SCANNER.

   This makes Safari camera permission
   much more reliable.
   ========================================= */


</script>


</body>

</html>
